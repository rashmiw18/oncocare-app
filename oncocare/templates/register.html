<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — OncoCare AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div class="auth-waveline" aria-hidden="true">
  <svg viewBox="0 0 1200 120" preserveAspectRatio="none" class="ecg-svg">
    <path class="ecg-path" d="M0,60 L120,60 L150,20 L180,100 L210,60 L340,60 L370,20 L400,100 L430,60 L560,60 L590,20 L620,100 L650,60 L1200,60" />
  </svg>
</div>

<div class="auth-shell">
  <div class="auth-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 24" class="pulse-icon">
        <polyline points="0,12 9,12 12,4 16,20 19,12 40,12" />
      </svg>
    </span>
    <span class="brand-name">OncoCare <em>AI</em></span>
  </div>

  <div class="auth-card">
    <div class="role-tabs" id="roleTabs">
      <button type="button" class="role-tab {{ 'active' if role != 'doctor' else '' }}" data-role="patient">Patient</button>
      <button type="button" class="role-tab {{ 'active' if role == 'doctor' else '' }}" data-role="doctor">Doctor</button>
    </div>

    <h1>Create your account</h1>
    <p class="auth-sub" id="authSub">Set up patient access to log vitals and track risk over time.</p>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <input type="hidden" name="role" id="roleField" value="{{ role or 'patient' }}">

      <label class="field">
        <span class="field-label">Full name</span>
        <input type="text" name="full_name" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">Username</span>
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label class="field">
        <span class="field-label">Email <em>optional</em></span>
        <input type="email" name="email">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" required autocomplete="new-password">
      </label>

      <label class="field" id="specializationField">
        <span class="field-label">Specialization <em>optional</em></span>
        <input type="text" name="specialization" placeholder="e.g. Medical Oncology">
      </label>

      <label class="field hidden" id="doctorField">
        <span class="field-label">Assign a doctor <em>optional</em></span>
        <select name="doctor_id">
          <option value="">No doctor yet — I'll add one later</option>
          {% for d in doctors %}
          <option value="{{ d.id }}">Dr. {{ d.full_name }}{% if d.specialization %} — {{ d.specialization }}{% endif %}</option>
          {% endfor %}
        </select>
      </label>

      <button type="submit" class="btn btn-primary auth-submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>

<script>
  const roleField = document.getElementById('roleField');
  const sub = document.getElementById('authSub');
  const doctorField = document.getElementById('doctorField');
  const specField = document.getElementById('specializationField');
  const copy = {
    patient: "Set up patient access to log vitals and track risk over time.",
    doctor:  "Set up a clinician account to monitor and support your patients."
  };
  function applyRole(role) {
    roleField.value = role;
    sub.textContent = copy[role];
    doctorField.classList.toggle('hidden', role !== 'patient');
    specField.classList.toggle('hidden', role !== 'doctor');
  }
  document.querySelectorAll('.role-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.role-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyRole(btn.dataset.role);
    });
  });
  applyRole(roleField.value);
</script>
</body>
</html>
